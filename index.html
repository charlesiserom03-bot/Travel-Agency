<script>
    const nav = document.querySelector('.header');
    const toggleButton = document.querySelector('.nav-toggle');

    if (toggleButton) {
        toggleButton.addEventListener('click', () => {
            nav.classList.toggle('open');
        });
    }

    const loveBtns = document.querySelectorAll('.love-btn');
    loveBtns.forEach((button) => {
        button.addEventListener('click', () => {
            button.classList.toggle('active');
            const icon = button.querySelector('i');
            if (icon) {
                icon.classList.toggle('fa-solid');
                icon.classList.toggle('fa-regular');
            }
        });
    });

    const searchInput = document.querySelector('.searchContainer input[type="text"]');
    const cards = document.querySelectorAll('.location-card');
    const filterButton = document.querySelector('.searchContainer button');

    function filterLocations() {
        const query = searchInput ? searchInput.value.trim().toLowerCase() : '';

        cards.forEach((card) => {
            const text = card.textContent.toLowerCase();
            const match = text.includes(query);
            card.classList.toggle('hidden', query && !match);
        });
    }

    if (searchInput) {
        searchInput.addEventListener('input', filterLocations);
    }

    if (filterButton) {
        filterButton.addEventListener('click', filterLocations);
    }

    document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener('click', (event) => {
            const targetId = anchor.getAttribute('href');
            if (!targetId || targetId === '#') return;

            const target = document.querySelector(targetId);
            if (target) {
                event.preventDefault();
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    });
</script>
